apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booking.name" . }}-backend
  labels:
    {{- include "booking.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "booking.selectorLabels" . | nindent 6 }}
      component: backend

  template:
    metadata:
      labels:
        {{- include "booking.selectorLabels" . | nindent 8 }}
        component: backend

    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine

          envFrom:
            - configMapRef:
                name: {{ include "booking.name" . }}-config
            - secretRef:
                name: {{ include "booking.name" . }}-secret

          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"; do
                echo "waiting for postgres..."
                sleep 3
              done

      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "booking.name" . }}-config
            - secretRef:
                name: {{ include "booking.name" . }}-secret

          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10