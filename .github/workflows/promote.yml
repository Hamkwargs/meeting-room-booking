name: Promote Release

# ใช้กด Run workflow เองใน GitHub Actions UI เพื่อ promote image tag
# ที่ทดสอบผ่านใน dev แล้ว ไปยัง staging หรือ production
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Commit SHA ของ image ที่ทดสอบผ่านใน dev แล้ว (เว้นว่างไว้ = ใช้ HEAD ของ main)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  promote:
    name: Promote to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    # ถ้าตั้งค่า GitHub Environment protection rule (require approval) ไว้
    # สำหรับ production ตัวนี้จะใช้ gate นั้นโดยอัตโนมัติ
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tag
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update values-${{ github.event.inputs.environment }}.yaml
        run: |
          set -e
          FILE="helm-chart/values-${{ github.event.inputs.environment }}.yaml"
          TAG="${{ steps.resolve.outputs.tag }}"

          yq -i ".image.tag = \"$TAG\"" "$FILE"
          yq -i ".frontend.image.tag = \"$TAG\"" "$FILE"

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          FILE="helm-chart/values-${{ github.event.inputs.environment }}.yaml"
          git add "$FILE"

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "ci: promote ${{ github.event.inputs.environment }} to ${{ steps.resolve.outputs.tag }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main