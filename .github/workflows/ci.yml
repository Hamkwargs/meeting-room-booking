name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: meeting-room-booking-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-${{ matrix.component }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-${{ matrix.component }}:latest

  update-values:
    name: Update dev Helm values
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update dev Helm values (values.yaml)
        run: |
          set -e
          yq -i '.image.repository = "${{ secrets.DOCKERHUB_USERNAME }}/booking-backend"' helm-chart/values.yaml
          yq -i '.image.tag = "${{ github.sha }}"' helm-chart/values.yaml
          yq -i '.frontend.image.repository = "${{ secrets.DOCKERHUB_USERNAME }}/booking-frontend"' helm-chart/values.yaml
          yq -i '.frontend.image.tag = "${{ github.sha }}"' helm-chart/values.yaml

      - name: Commit and push image tags (dev)
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm-chart/values.yaml

          if git diff --cached --quiet; then
            echo "No image tag changes"
            exit 0
          fi

          git commit -m "ci: update dev image tags to ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main