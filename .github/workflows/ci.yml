name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-frontend:latest

      - name: Update image tags in values.yaml
        run: |
          yq -i '.image.tag = "${{ github.sha }}"' helm-chart/values.yaml
          yq -i '.frontend.image.tag = "${{ github.sha }}"' helm-chart/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm-chart/values.yaml
          git diff --cached --quiet || (git commit -m "ci: update image tags to ${{ github.sha }}" && git push)