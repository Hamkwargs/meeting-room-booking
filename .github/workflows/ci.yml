name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: meeting-room-booking-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: image-tag
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-frontend:latest

  deploy-dev:
    name: Deploy to Development
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: booking-dev

    steps:
      - name: Deploy to Kubernetes VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            echo "========================================"
            echo "Deploying Meeting Room Booking"
            echo "Image tag: ${{ needs.build-and-push.outputs.image_tag }}"
            echo "========================================"

            cd "${{ secrets.APP_DIR }}"

            echo "Updating source code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Checking Kubernetes connection..."
            kubectl cluster-info
            kubectl get nodes

            echo "Deploying Helm chart..."
            helm upgrade --install booking-dev ./helm-chart \
              --namespace booking-dev \
              --create-namespace \
              --values helm-chart/values.yaml \
              --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/booking-backend \
              --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
              --set frontend.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/booking-frontend \
              --set frontend.image.tag=${{ needs.build-and-push.outputs.image_tag }} \
              --wait \
              --timeout 5m

            echo "Waiting for backend deployment..."
            kubectl rollout status \
              deployment/booking-dev-meeting-room-booking-backend \
              --namespace booking-dev \
              --timeout=180s

            echo "Waiting for frontend deployment..."
            kubectl rollout status \
              deployment/booking-dev-meeting-room-booking-frontend \
              --namespace booking-dev \
              --timeout=180s

            echo "Current pods:"
            kubectl get pods -n booking-dev -o wide

            echo "Current services:"
            kubectl get services -n booking-dev

            echo "Checking migration job..."
            kubectl wait \
              --for=condition=complete \
              job/booking-dev-meeting-room-booking-migrate \
              --namespace booking-dev \
              --timeout=180s || true

            echo "Checking database rooms..."
            BACKEND_POD=$(kubectl get pods \
              --namespace booking-dev \
              --selector=app.kubernetes.io/instance=booking-dev,component=backend \
              --field-selector=status.phase=Running \
              --output=jsonpath='{.items[0].metadata.name}')

            if [ -z "$BACKEND_POD" ]; then
              echo "Backend pod was not found"
              kubectl get pods -n booking-dev
              exit 1
            fi

            echo "Backend pod: $BACKEND_POD"

            kubectl exec \
              --namespace booking-dev \
              "$BACKEND_POD" \
              -- node -e "
                const pool = require('./src/db/pool');

                pool.query('SELECT COUNT(*) AS room_count FROM rooms')
                  .then(result => {
                    console.log('Database connection successful');
                    console.log(result.rows);
                    process.exit(0);
                  })
                  .catch(error => {
                    console.error('Database check failed');
                    console.error(error);
                    process.exit(1);
                  });
              "

            echo "========================================"
            echo "Deployment completed successfully"
            echo "========================================"